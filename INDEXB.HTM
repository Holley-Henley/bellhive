<!-- Home page 3D scene. The theme (themes/themes.js) is picked by index.html and sent here by
     postMessage; each theme is themes/<id>.js. Opened on its own, it shows the beehive. Three.js r160. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const lib = { THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass };
const box = document.getElementById('hive3d');
let mounted = false;

function mount(id) {
  if (mounted) return;
  mounted = true;
  if (!/^[a-z0-9-]+$/.test(id || '')) id = 'beehive';
  const s = document.createElement('script');
  s.src = 'themes/' + id + '.js';
  s.onload = () => {
    const scene = window.BHScenes && window.BHScenes[id];
    if (scene) {
      scene(box, lib);
      try { if (window.parent !== window) window.parent.postMessage({ bhThemeShown: id }, '*'); } catch (err) { /* no parent */ }
    } else if (id !== 'beehive') { mounted = false; mount('beehive'); }
  };
  s.onerror = () => { if (id !== 'beehive') { mounted = false; mount('beehive'); } };
  document.body.appendChild(s);
}

/* index.html tells every frame who is signed in; the home page theme rides along as bhTheme */
window.addEventListener('message', (e) => { if (e.data && typeof e.data.bhTheme === 'string' && e.data.bhTheme) mount(e.data.bhTheme); });
try { if (window.parent !== window) window.parent.postMessage({ bhAsk: 'role' }, '*'); } catch (err) { /* no parent */ }
setTimeout(() => mount('beehive'), window.parent !== window ? 4000 : 0);
</script>
